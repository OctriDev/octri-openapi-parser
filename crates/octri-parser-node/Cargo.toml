[package]
name = "octri-parser-node"
description = "Node-API transport for the Octri Rust parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
octri-parser.workspace = true
octri-parser-native.workspace = true
serde_json.workspace = true
napi = { version = "3.14", default-features = false, features = ["napi8"] }
napi-derive = "3.5"

[build-dependencies]
napi-build = "2.3"
