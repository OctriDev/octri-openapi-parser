[workspace]
members = ["crates/*"]
default-members = ["crates/octri-parser", "crates/octri-parser-native", "crates/octri-parser-cli"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
authors = ["Octri contributors"]
repository = "https://github.com/octridev/octri-openapi-parser"
homepage = "https://octri.dev/openapi-parser"
readme = "README.md"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["unbounded_depth", "arbitrary_precision"] }
url = { version = "2.5", features = ["serde"] }
thiserror = "2.0"
octri-parser = { path = "crates/octri-parser", version = "0.1.2" }
octri-parser-native = { path = "crates/octri-parser-native", version = "0.1.2" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.release.package.octri-parser-wasm]
opt-level = "s"
